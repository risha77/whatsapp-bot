# =============================================
# WHATSAPP CHATBOT - Configuration
# =============================================

# Server
server.port=8080

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/chatbot
spring.data.mongodb.database=chatbot

# =============================================
# META WHATSAPP CLOUD API
# =============================================
whatsapp.phone-number-id=1234567890
whatsapp.access-token=  YOUR_LONG_LIVED_ACCESS_TOKEN
whatsapp.verify-token=YOUR_WEBHOOK_VERIFY_TOKEN
whatsapp.api-url=https://graph.facebook.com/v19.0

# =============================================
# OPENAI
# =============================================
openai.api-key=YOUR_OPENAI_API_KEY
openai.model=gpt-4o-mini
openai.max-tokens=500
openai.temperature=0.7

# =============================================
# GOOGLE SHEETS
# =============================================
google.sheets.spreadsheet-id=YOUR_GOOGLE_SPREADSHEET_ID
google.sheets.sheet-name=Leads

# CREDENTIALS OPTIONS (use ONE of the following):
# Option 1: File-based (legacy)
# google.sheets.credentials-path=classpath:google-credentials.json

# Option 2: JSON string (via environment variable GOOGLE_SHEETS_CREDENTIALS_JSON)
# google.sheets.credentials-json=${GOOGLE_SHEETS_CREDENTIALS_JSON:}

# Option 3: Application Default Credentials (gcloud auth) - RECOMMENDED
# =============================================
# EMAIL (Spring Mail - Gmail SMTP)
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_EMAIL@gmail.com
spring.mail.password=YOUR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Sales team notification email
notification.sales-email=sales@example.com
notification.whatsapp-number=91XXXXXXXXXX

# =============================================
# CLOUDINARY (Image Storage)
# =============================================
cloudinary.cloud-name=YOUR_CLOUD_NAME
cloudinary.api-key=YOUR_API_KEY
cloudinary.api-secret=YOUR_API_SECRET

# =============================================
# LOGGING
# =============================================
logging.level.com.chatbot=DEBUG
logging.level.org.springframework.web=INFO

# =============================================
# ACTUATOR (Render health check)
# =============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# =============================================
# ASYNC THREAD POOL (for @Async Google Sheets / email)
# =============================================
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100

leads.csv.path=/absolute/or/relative/path/to/leads.csv